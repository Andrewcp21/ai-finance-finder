name = "ai-finance-finder"
main = "worker.js"
compatibility_date = "2026-11-01"
account_id = "8383f94454bf227d879221677a72a9a1"
workers_dev = false
routes = [
  { pattern = "tools.revou.co/ai-finance-finder*", zone_name = "revou.co" }
